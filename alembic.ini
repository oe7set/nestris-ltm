# Developer entry point for Alembic (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The app itself migrates on startup via nestris_ltm.db.bootstrap.
[alembic]
script_location = src/nestris_ltm/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
