# Mosquitto configuration for the NestrisLTM host
# (C:\Program Files\mosquitto\mosquitto.conf, then restart the "Mosquitto Broker" service).

# Keep persistent sessions and queued QoS 1 messages across broker restarts.
# Without this, results queued for NestrisLTM are lost when the broker restarts.
persistence true
persistence_location C:/ProgramData/mosquitto/
autosave_interval 30

# Queue enough events per offline client (game_end etc. are QoS 1).
max_queued_messages 10000

listener 1883
protocol mqtt

# Tournament LAN: anonymous access is the simplest setup. For a shared or
# untrusted network, create users with
#   mosquitto_passwd -c C:/ProgramData/mosquitto/passwd nestris-ltm
# and replace the next line with:
#   allow_anonymous false
#   password_file C:/ProgramData/mosquitto/passwd
allow_anonymous true

log_dest file C:/ProgramData/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
