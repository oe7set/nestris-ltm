# Release: push a tag "v<version>" (the version in pyproject.toml), e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# Builds the admin UI, the PyInstaller folder and the Inno Setup installer on
# Windows, signs SHA256SUMS.txt (secret RELEASE_SIGNING_KEY, see
# docs/UPDATES.md in nestris-ltm) and publishes them as a GitHub release (tags with "-", e.g.
# v0.2.0-rc1, become pre-releases).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Check tag matches pyproject version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match pyproject version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist\NestrisLTM -DestinationPath "dist\NestrisLTM-$v-portable.zip"
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: uv run --script .github/scripts/sign_release.py sign dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NestrisLTM ${{ steps.version.outputs.version }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: |
            dist/NestrisLTM-Setup-*.exe
            dist/NestrisLTM-*-portable.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
